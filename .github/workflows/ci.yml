name: CI
on:
  push: { branches: [main, hackathon-mvp] }
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: typecheck · lint · test · eval · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm eval
      # Сборка без обращения к базе: все страницы кабинета динамические
      - run: pnpm --filter @all/web build
        env:
          DATA_SOURCE: supabase
          SUPABASE_URL: http://127.0.0.1:54321
          SUPABASE_ANON_KEY: build-placeholder

  db:
    name: Supabase migrations + RLS tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - run: supabase start -x studio,imgproxy
        working-directory: packages/db
      # Чистая база: все миграции по порядку + seed.sql
      - run: supabase db reset
        working-directory: packages/db
      # pgTAP: изоляция компаний, роли, закрытые сервисные RPC
      - run: supabase test db
        working-directory: packages/db

  e2e:
    name: E2E (Hackathon MVP on local Supabase)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - run: pnpm install --frozen-lockfile
      - run: supabase start -x studio,imgproxy
        working-directory: packages/db
      - name: Export Supabase keys and generate demo passwords
        working-directory: packages/db
        run: |
          eval "$(supabase status -o env)"
          OWNER_PW="$(openssl rand -base64 18)"; STAFF_PW="$(openssl rand -base64 18)"
          echo "::add-mask::$OWNER_PW"; echo "::add-mask::$STAFF_PW"
          {
            echo "SUPABASE_URL=$API_URL"
            echo "SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "E2E_SUPABASE_URL=$API_URL"
            echo "E2E_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "DEMO_OWNER_PASSWORD=$OWNER_PW"
            echo "DEMO_STAFF_PASSWORD=$STAFF_PW"
            echo "E2E_OWNER_PASSWORD=$OWNER_PW"
            echo "E2E_STAFF_PASSWORD=$STAFF_PW"
          } >> "$GITHUB_ENV"
      - name: Provision demo company (idempotent, run twice)
        run: |
          pnpm --filter @all/web provision:demo --with-isolation-fixture
          pnpm --filter @all/web provision:demo --with-isolation-fixture
      - name: Build and start web (DATA_SOURCE=supabase)
        working-directory: apps/web
        env: { DATA_SOURCE: supabase }
        run: |
          pnpm build
          nohup pnpm start -p 3000 > ../../next.log 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:3000/login && exit 0; sleep 1; done
          cat ../../next.log; exit 1
      - run: pnpm --filter @all/web exec playwright install --with-deps chromium
      - name: E2E scenarios
        env: { E2E_MODE: supabase, E2E_URL: "http://localhost:3000" }
        run: pnpm e2e
      - name: Server log
        if: always()
        run: cat next.log || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: apps/web/test-results, retention-days: 7 }

  voice:
    name: Python voice tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pytest
      - run: cd apps/voice && PYTHONPATH=src python -m pytest tests -q
