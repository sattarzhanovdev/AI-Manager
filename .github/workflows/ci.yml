name: CI
on:
  push: { branches: [main] }
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm eval
      - run: pnpm --filter @all/web build
        env: { DATA_SOURCE: mock }

  db:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
      - run: cd packages/db && supabase start -x studio,imgproxy,inbucket
      - run: cd packages/db && supabase test db   # тест изоляции RLS двух компаний

  voice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pytest
      - run: cd apps/voice && PYTHONPATH=src python -m pytest tests -q
